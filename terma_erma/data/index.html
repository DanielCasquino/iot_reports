<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@48,700,0,0&icon_names=power_settings_new" />
    <title>Terma</title>
</head>

<body>
    <span id="temp-display" class="temp-display">29.0°C</span>

    <button id="big-button" class="big-button big-button-off" onclick="toggleTerma()">
        <i class="material-symbols-outlined">
            power_settings_new
        </i>
    </button>

    <div class="option-list">
        <div class="option">
            <div class="option-header">
                <span>Low Cortisol Mode</span>
                <label class="switch">
                    <input id="automated-shutdown" type="checkbox" onchange="toggleAutomatedShutdown(this)">
                    <span class="slider"></span>
                </label>
            </div>
            <span class="option-description">If enabled, the heater will turn off automatically when reaching
                maximum temperature.</span>
        </div>
        <div class="option">
            <div class="option-header">
                <span>Farenheit Display</span>
                <label class="switch">
                    <input id="farenheit" type="checkbox" onchange="toggleFarenheit(this)">
                    <span class="slider"></span>
                </label>
            </div>
        </div>
    </div>
</body>
<script src="script.js"></script>

</html>
