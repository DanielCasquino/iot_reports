; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32doit-devkit-v1

[env:esp32doit-devkit-v1]
platform = espressif32@8.0.0
platform_packages =
	platformio/framework-arduinoespressif32@4.30312.261024
	platformio/framework-arduinoespressif32-esp32-libs@3.3.12
	platformio/toolchain-xtensa-esp-elf@14.2.0+20260121
board = esp32doit-devkit-v1
framework = arduino
board_build.filesystem = littlefs
monitor_speed = 115200
lib_deps = 
	https://github.com/cyijun/ESP32MQTTClient.git#ce639e633ad69683d6fb27362b08de2bcda6920c
	paulstoffregen/OneWire@2.3.8
	milesburton/DallasTemperature@4.0.6
	madhephaestus/ESP32Servo@3.2.1
	adafruit/Adafruit TCS34725@1.4.4
	adafruit/Adafruit SSD1306@2.5.17

; Pin transitive display/I2C dependencies used by the verified build.
	adafruit/Adafruit GFX Library@1.13.0
	adafruit/Adafruit BusIO@1.17.4

[env:esp32doit-devkit-v1-flow]
extends = env:esp32doit-devkit-v1
build_flags = -DFLOW_SENSOR_ENABLED=1
