<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
    />
    <title>Terma Erma</title>
  </head>

  <body>
    <div id="top-bar" class="top-bar">
      <div id="broker-status" class="icon-wrapper icon-wrapper-off">
        <span class="material-symbols-outlined"> wifi </span>
      </div>
      <div id="esp-status" class="icon-wrapper icon-wrapper-off">
        <span class="material-symbols-outlined"> developer_board </span>
      </div>
    </div>

    <div class="content">
      <span id="temp-display" class="temp-display">--.-°C</span>

      <span id="temperature-status">Temperature unavailable</span>
      <button id="capture-temperature" onclick="captureTemperature()">Read display</button>
      <span id="color-display">RGB sensor unavailable</span>
      <span id="camera-status" aria-live="polite"></span>
      <details><summary>Camera preview</summary><img id="camera-preview" alt="Last captured display" style="max-width:100%"></details>

      <button
        id="big-button"
        class="big-button big-button-off"
        onclick="toggleTerma()"
      >
        <span class="material-symbols-outlined"> power_settings_new </span>
      </button>

      <div class="option-list">
        <div class="option">
          <div class="option-header">
            <span>Low Cortisol Mode</span>
            <label class="switch">
              <input
                id="automated-shutdown"
                type="checkbox"
                onchange="toggleAutomatedShutdown(this)"
              />
              <span class="slider"></span>
            </label>
          </div>
          <span class="option-description"
            >If enabled, the heater will turn off automatically when reaching
            maximum temperature.</span
          >
        </div>
        <div class="option">
          <div class="option-header">
            <span>Fahrenheit Display</span>
            <label class="switch">
              <input
                id="fahrenheit"
                type="checkbox"
                onchange="toggleFahrenheit(this)"
              />
              <span class="slider"></span>
            </label>
          </div>
          <span class="option-description"
            >You're so weird if you use this.</span
          >
        </div>
      </div>
    </div>
    <div class="bottom-bar"></div>
    <div id="fg" class="fg"></div>
  </body>
  <script src="script.js" defer></script>
</html>
