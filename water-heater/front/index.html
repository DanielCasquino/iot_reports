<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f1f3f6" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
    <title>Terma Erma</title>
  </head>
  <body>
    <div id="top-bar" class="top-bar">
      <div id="broker-status" class="icon-wrapper icon-wrapper-off" role="img" aria-label="Disconnected">
        <span class="material-symbols-outlined" aria-hidden="true">wifi</span>
      </div>
      <div id="esp-status" class="icon-wrapper icon-wrapper-off" role="img" aria-label="Device offline">
        <span class="material-symbols-outlined" aria-hidden="true">developer_board</span>
      </div>
      <details class="settings">
        <summary class="material-symbols-outlined" aria-label="Details" title="Details">more_horiz</summary>
        <div class="settings-panel">
          <p id="flow-display">Flow unavailable</p>
          <p id="heater-observation">Waiting for fresh readings</p>
          <p id="color-display">RGB unavailable</p>
          <button id="capture-temperature" disabled onclick="captureTemperature()">Read display</button>
          <p id="camera-status" role="status"></p>
          <img id="camera-preview" alt="Last captured display" />
        </div>
      </details>
    </div>
    <main class="content">
      <span id="temp-display" class="temp-display">--.-°C</span>
      <span id="temperature-status" class="sr-only" role="status">Temperature unavailable</span>
      <span id="connection-status" class="sr-only" role="status">Disconnected</span>
      <button id="big-button" class="big-button big-button-off" disabled aria-label="Toggle heater power" onclick="toggleTerma()">
        <span class="material-symbols-outlined" aria-hidden="true">power_settings_new</span>
      </button>
      <div class="option-list">
        <div class="option"><div class="option-header">
          <span>Low Cortisol Mode</span>
          <label class="switch"><input id="automated-shutdown" disabled aria-label="Automatic shutdown" type="checkbox" onchange="toggleAutomatedShutdown(this)" /><span class="slider"></span></label>
        </div>
          <span class="option-description">If enabled, the heater will turn off automatically when reaching
            maximum temperature.</span>
        </div>
        <div class="option"><div class="option-header">
          <span>Fahrenheit Display</span>
          <label class="switch"><input id="fahrenheit" aria-label="Display Fahrenheit" type="checkbox" onchange="toggleFahrenheit(this)" /><span class="slider"></span></label>
        </div>
          <span class="option-description">You're so weird if you use this.</span>
        </div>
      </div>
    </main>
    <div id="fg" class="fg"></div>
    <script src="script.js" defer></script>
  </body>
</html>
